<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier Ninfea – Centro estetico in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --scene:#E4EBE6; --ground:#D7E0DA;
  --panel:rgba(255,255,255,.84); --panel-line:rgba(31,58,61,.12);
  --ink:#1F3A3D; --muted:#5D7270; --accent:#A8676E; --accent-soft:rgba(201,154,158,.22);
  --display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --scene:#152127; --ground:#1C2B31;
    --panel:rgba(20,32,38,.86); --panel-line:rgba(234,240,238,.12);
    --ink:#EAF0EE; --muted:#9FB2AF; --accent:#E2AEB3; --accent-soft:rgba(226,174,179,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --scene:#152127; --ground:#1C2B31;
  --panel:rgba(20,32,38,.86); --panel-line:rgba(234,240,238,.12);
  --ink:#EAF0EE; --muted:#9FB2AF; --accent:#E2AEB3; --accent-soft:rgba(226,174,179,.16);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--scene);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}

.panel{background:var(--panel);border:1px solid var(--panel-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:18px;padding:14px 20px 14px 18px;border-radius:4px 22px 22px 4px;border-left:3px solid var(--accent)}
.brand h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.05;margin:0;letter-spacing:.01em}
.brand p{margin:4px 0 0;font-size:13px;color:var(--muted)}

.rooms{position:fixed;left:18px;top:calc(env(safe-area-inset-top,0px) + 112px);padding:8px;border-radius:14px;display:flex;flex-direction:column;gap:2px;width:236px}
.rooms button{all:unset;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:14px;cursor:pointer;color:var(--ink)}
.rooms button:hover{background:var(--accent-soft)}
.rooms button[aria-pressed="true"]{background:var(--accent-soft);font-weight:600}
.rooms button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.swatch{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}

.tools{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);right:18px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}
.tools button{font:500 13px var(--body);color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer}
.tools button:hover{border-color:var(--accent)}
.tools button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.tools button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:330px;padding:20px 22px 18px;border-radius:16px;transform:translateY(12px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.card.open{opacity:1;transform:none;pointer-events:auto}
.card h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 28px 8px 0;line-height:1.15}
.card p{margin:0 0 12px;font-size:14px;line-height:1.55;color:var(--muted)}
.card ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.card li{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--accent-soft)}
.card .close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
.card .close:hover{color:var(--ink)}
.card .close:focus-visible{outline:2px solid var(--accent)}

.hint{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:12.5px;color:var(--muted);padding:8px 12px;border-radius:10px;max-width:420px}
.tip{position:fixed;pointer-events:none;padding:5px 10px;border-radius:8px;font-size:13px;font-weight:600;transform:translate(14px,14px);opacity:0;transition:opacity .12s;white-space:nowrap}
.tip.show{opacity:1}

@media (max-width:760px){
  .brand{left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);padding:10px 14px}
  .brand h1{font-size:22px}
  .brand p{font-size:12px}
  .tools{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);right:12px;left:12px;justify-content:flex-start}
  .tools button{padding:7px 11px;font-size:12px}
  .rooms{top:auto;left:0;right:0;width:auto;bottom:0;border-radius:16px 16px 0 0;flex-direction:row;overflow-x:auto;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px)}
  .rooms button{white-space:nowrap;flex:none;font-size:13px}
  .card{left:12px;right:12px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 118px)}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>

<header class="brand panel">
  <h1>Atelier Ninfea</h1>
  <p>Centro estetico, pianta interattiva in 3D</p>
</header>

<nav class="rooms panel" id="rooms" aria-label="Stanze"></nav>

<div class="tools">
  <button class="panel" id="btnOverview">Vista d’insieme</button>
  <button class="panel" id="btnTour" aria-pressed="false">Avvia il tour</button>
  <button class="panel" id="btnWalls">Alza le pareti</button>
  <button class="panel" id="btnLight">Luce serale</button>
</div>

<aside class="card panel" id="card" aria-live="polite">
  <button class="close" id="cardClose" aria-label="Chiudi la scheda">×</button>
  <h2 id="cardTitle"></h2>
  <p id="cardText"></p>
  <ul id="cardList"></ul>
</aside>

<div class="hint panel">Trascina per ruotare, usa la rotella o due dita per lo zoom, tieni premuto Maiusc (o il tasto destro) per spostarti. Tocca una stanza per entrarci.</div>
<div class="tip panel" id="tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const ROOMS=[
  {id:"reception",name:"Reception e attesa",x1:-3,x2:4,z1:0,z2:7,floor:0xCFB28E,
   text:"Qui si accoglie la clientela, si prenotano i trattamenti e si scelgono i prodotti. Il salottino permette di attendere con calma.",
   items:["Accoglienza e prenotazioni","Vendita prodotti","Zona attesa con tisane"]},
  {id:"nails",name:"Area mani e piedi",x1:-10,x2:-3,z1:0,z2:7,floor:0xE9E1DA,
   text:"Due postazioni manicure e due poltrone pedicure con vaschetta, accanto alla parete degli smalti.",
   items:["Manicure e semipermanente","Pedicure estetico","Ricostruzione unghie"]},
  {id:"relax",name:"Zona relax",x1:4,x2:10,z1:0,z2:7,floor:0xD8D3CB,
   text:"Uno spazio luminoso con vasca idromassaggio e lettini per riposare prima o dopo i trattamenti.",
   items:["Idromassaggio","Lettini relax","Angolo tisane"]},
  {id:"face",name:"Cabina viso",x1:-10,x2:-4,z1:-7,z2:0,floor:0xEAD9D4,
   text:"Cabina per i trattamenti del viso, con lettino regolabile, lampada con lente e carrello dei prodotti.",
   items:["Pulizia del viso","Trattamenti antietà","Ciglia e sopracciglia"]},
  {id:"massage",name:"Cabina massaggi",x1:-4,x2:2,z1:-7,z2:0,floor:0xBFA184,
   text:"Cabina riservata e in penombra per i massaggi corpo, illuminata dalle candele.",
   items:["Massaggio rilassante","Linfodrenaggio","Trattamenti corpo"]},
  {id:"sauna",name:"Sauna",x1:2,x2:5,z1:-7,z2:0,floor:0xB4844F,
   text:"Sauna finlandese in legno con panche su due livelli e stufa a pietre.",
   items:["Sauna finlandese","Percorso caldo e freddo"]},
  {id:"locker",name:"Spogliatoio e docce",x1:5,x2:10,z1:-7,z2:0,floor:0xD3DDD9,
   text:"Armadietti, panca e due docce per cambiarsi prima e dopo i percorsi benessere.",
   items:["Armadietti","Docce","Asciugacapelli"]}
];

/* ---------- renderer & scene ---------- */
const stage=document.getElementById("stage");
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const canvas=renderer.domElement;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,200);

const groundMat=new THREE.MeshStandardMaterial({color:0xD7E0DA,roughness:1});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),groundMat);
ground.rotation.x=-Math.PI/2; ground.position.y=-.11; ground.receiveShadow=true; scene.add(ground);

function applyTheme(){
  const cs=getComputedStyle(document.documentElement);
  const bg=cs.getPropertyValue("--scene").trim()||"#E4EBE6";
  const gr=cs.getPropertyValue("--ground").trim()||"#D7E0DA";
  scene.background=new THREE.Color(bg);
  scene.fog=new THREE.Fog(bg,45,95);
  groundMat.color.set(gr);
}
applyTheme();
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);}catch(e){}

/* ---------- lights ---------- */
const hemi=new THREE.HemisphereLight(0xffffff,0xC9B8A8,.85); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff4e8,.75);
sun.position.set(9,18,12); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-15,right:15,top:15,bottom:-15,near:1,far:50});
sun.shadow.bias=-.0008; scene.add(sun);
const roomLights=ROOMS.map(r=>{
  const l=new THREE.PointLight(r.id==="sauna"?0xFF9A55:0xFFC98F,0,9,2);
  l.position.set((r.x1+r.x2)/2,2.3,(r.z1+r.z2)/2); scene.add(l); return l;
});

/* ---------- helpers ---------- */
const cache={};
function M(color,o){o=o||{};const k=color+JSON.stringify(o);
  if(!cache[k])cache[k]=new THREE.MeshStandardMaterial(Object.assign({color:color,roughness:.8,metalness:0},o));return cache[k];}
function sh(m){m.castShadow=true;m.receiveShadow=true;return m;}
function box(p,w,h,d,c,x,y,z,o){const m=sh(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,o)));m.position.set(x,y,z);p.add(m);return m;}
function cyl(p,rt,rb,h,c,x,y,z,o,seg){const m=sh(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||28),M(c,o)));m.position.set(x,y,z);p.add(m);return m;}
function blob(p,r,c,x,y,z){const m=sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),M(c,{flatShading:true,roughness:.9})));m.position.set(x,y,z);p.add(m);return m;}
function grp(x,z,rot){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot||0;scene.add(g);return g;}

const C={white:0xF7F4F0,marble:0xF2EFEA,sage:0x8FA89A,sageDark:0x6E8A7C,rose:0xC99A9E,roseLight:0xE8C8C8,teal:0x2F4B4E,
  wood:0xA77B50,woodLight:0xC9A479,leaf:0x6F8F6B,leaf2:0x86A47C,stone:0x8B8680,water:0x7EC6C9};
const BRASS={metalness:.65,roughness:.35};

function plant(x,z,s){s=s||1;const g=grp(x,z);g.scale.setScalar(s);
  cyl(g,.24,.18,.45,C.white,0,.225,0);
  blob(g,.32,C.leaf,0,.75,0);blob(g,.24,C.leaf2,.16,.98,.06);blob(g,.22,C.leaf,-.14,1.05,-.08);blob(g,.18,C.leaf2,.02,1.22,.02);}
function chair(g,c){c=c||C.white;
  box(g,.5,.08,.5,c,0,.46,0);box(g,.5,.5,.06,c,0,.73,-.22);
  [[-.21,-.21],[.21,-.21],[-.21,.21],[.21,.21]].forEach(p=>cyl(g,.02,.02,.44,0x9C9690,p[0],.22,p[1],BRASS,8));}
function sofa(x,z,rot,w,c){const g=grp(x,z,rot);
  box(g,w,.42,.85,c,0,.21,0);box(g,w,.5,.2,c,0,.62,-.33);
  box(g,.18,.62,.85,c,-w/2+.09,.31,0);box(g,.18,.62,.85,c,w/2-.09,.31,0);
  box(g,w/2-.2,.12,.6,C.white,-w/4+.02,.48,.06);box(g,w/2-.2,.12,.6,C.white,w/4-.02,.48,.06);return g;}
function armchair(x,z,rot,c){const g=grp(x,z,rot);
  box(g,.85,.42,.8,c,0,.21,0);box(g,.85,.5,.18,c,0,.6,-.31);box(g,.14,.6,.8,c,-.36,.3,0);box(g,.14,.6,.8,c,.36,.3,0);return g;}
function lounger(x,z,rot){const g=grp(x,z,rot);
  box(g,.72,.3,1.3,C.woodLight,0,.15,.25);box(g,.66,.1,1.25,C.white,0,.35,.25);
  const b=box(g,.66,.1,.75,C.white,0,.62,-.65);b.rotation.x=-.75;
  box(g,.72,.3,.4,C.woodLight,0,.15,-.6);return g;}
function bed(x,z,rot,base,top){const g=grp(x,z,rot);
  box(g,.7,.62,1.9,base,0,.31,0);box(g,.74,.13,1.95,top,0,.68,0);
  const h=box(g,.7,.1,.5,top,0,.82,-.78);h.rotation.x=.35;box(g,.5,.12,.3,C.white,0,.92,-.85);return g;}

/* ---------- floors ---------- */
const floors=[];
ROOMS.forEach(r=>{
  r.cx=(r.x1+r.x2)/2;r.cz=(r.z1+r.z2)/2;r.w=r.x2-r.x1;r.d=r.z2-r.z1;
  const mat=new THREE.MeshStandardMaterial({color:r.floor,roughness:.88,emissive:0xC99A9E,emissiveIntensity:0});
  const m=new THREE.Mesh(new THREE.BoxGeometry(r.w,.1,r.d),mat);
  m.position.set(r.cx,-.05,r.cz);m.receiveShadow=true;m.userData.room=r;r.mesh=m;r.glow=0;
  scene.add(m);floors.push(m);
});

/* ---------- walls ---------- */
const walls=new THREE.Group();scene.add(walls);
const WH=2.8,WT=.15;
function wall(x1,z1,x2,z2,c){const hz=z1===z2;const len=hz?Math.abs(x2-x1):Math.abs(z2-z1);
  const g=new THREE.BoxGeometry(hz?len+WT:WT,WH,hz?WT:len+WT);g.translate(0,WH/2,0);
  const m=sh(new THREE.Mesh(g,M(c||0xEEE8E4,{roughness:.95})));m.position.set((x1+x2)/2,0,(z1+z2)/2);walls.add(m);}
function run(x1,z1,x2,z2,gaps,c){gaps=(gaps||[]).slice().sort((a,b)=>a[0]-b[0]);const hz=z1===z2;let a=hz?x1:z1;const end=hz?x2:z2;
  const seg=(s,e)=>hz?wall(s,z1,e,z1,c):wall(x1,s,x1,e,c);
  gaps.forEach(g=>{if(g[0]>a)seg(a,g[0]);a=g[1];});if(end>a)seg(a,end);}
run(-10,-7,10,-7);
run(-10,7,10,7,[[.5,2.5]]);
run(-10,-7,-10,7);run(10,-7,10,7);
run(-10,0,10,0,[[-5.6,-4.6],[-2,-1],[3,3.9],[6.5,7.5]]);
run(-3,0,-3,7,[[3,5]]);run(4,0,4,7,[[3,5]]);
run(-4,-7,-4,0);run(2,-7,2,0,null,0xC09468);run(5,-7,5,0,null,0xC09468);
let wallScale=.36,wallGoal=.36;walls.scale.y=wallScale;

/* ---------- outside ---------- */
for(let i=0;i<4;i++)box(scene,1.3,.05,.6,0xCFC8BE,1.5,.0,7.7+i*.85);
plant(-.3,7.8,.9);plant(3.3,7.8,.9);

/* ---------- reception ---------- */
{const g=grp(1.4,2.1);
 box(g,2.8,1.02,.7,C.white,0,.51,0);box(g,2.95,.06,.85,C.marble,0,1.05,-.02,{roughness:.3});
 box(g,2.82,.05,.05,0xB8955A,0,.55,.36,BRASS);
 cyl(g,.05,.07,.3,C.rose,-.9,1.23,0);blob(g,.13,C.leaf2,-.9,1.42,0);
 box(g,.42,.3,.04,0x333B3C,.6,1.24,-.15);}
{const g=grp(1.4,1.35,0);chair(g,C.teal);}
{const g=grp(1.2,.27);box(g,2.4,2.1,.3,C.white,0,1.05,0);
 [.45,1.05,1.65].forEach((y,i)=>{box(g,2.3,.04,.32,C.woodLight,0,y,.02);
   for(let k=0;k<7;k++)cyl(g,.06,.06,.22,[C.rose,C.sage,C.white,0xB8955A][(k+i)%4],-.95+k*.32,y+.13,.05,{roughness:.4},12);});}
{const rug=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.35,.02,48),M(C.roseLight,{roughness:1}));rug.position.set(-1.45,.01,4.6);rug.receiveShadow=true;scene.add(rug);}
sofa(-2.45,4.6,Math.PI/2,2,C.sage);
cyl(scene,.42,.42,.04,C.marble,-1.35,.42,4.6,{roughness:.3});cyl(scene,.05,.05,.4,0xB8955A,-1.35,.2,4.6,BRASS,10);
cyl(scene,.06,.05,.1,C.white,-1.2,.49,4.5);cyl(scene,.06,.05,.1,C.white,-1.45,.49,4.75);
armchair(-1.2,5.85,Math.PI,C.rose);
plant(-2.5,6.45);plant(3.5,6.45);plant(-2.5,.55,.8);

/* ---------- nails ---------- */
[-8,-5.4].forEach(x=>{const g=grp(x,4.8);
  box(g,1.25,.06,.62,C.white,0,.76,0);box(g,.06,.74,.55,C.white,-.58,.37,0);box(g,.06,.74,.55,C.white,.58,.37,0);
  box(g,.4,.03,.25,C.roseLight,0,.8,0);
  cyl(g,.08,.08,.03,0xB8955A,.45,.8,-.15,BRASS);const arm=cyl(g,.015,.015,.5,0xB8955A,.45,1.04,-.1,BRASS,8);arm.rotation.x=.4;
  const hd=sh(new THREE.Mesh(new THREE.ConeGeometry(.1,.14,16,1,true),M(C.white,{side:THREE.DoubleSide})));hd.position.set(.45,1.28,.02);g.add(hd);
  const c1=grp(x,5.55,Math.PI);chair(c1,C.rose);const c2=grp(x,4.05,0);chair(c2,C.teal);});
{const g=grp(-9.78,2.4);box(g,.25,1.4,1.8,C.white,0,1.2,0);
 for(let r=0;r<4;r++)for(let k=0;k<8;k++)cyl(g,.035,.035,.1,[0xC4384B,C.rose,0x8E3A59,0xE6B9A6,0xD06A6A,0x5A2E3A][(r*3+k)%6],.07,.62+r*.3,-.75+k*.21,{roughness:.3},10);}
[-9,-7.4].forEach(x=>{box(scene,1,.3,1.5,C.woodLight,x,.15,1.25);armchair(x,1.05,0,C.sage).position.y=.3;
  cyl(scene,.28,.24,.22,C.white,x,.11,2.2);});
plant(-3.6,6.45,.85);

/* ---------- relax ---------- */
cyl(scene,1.35,1.35,.62,C.marble,7.5,.31,4.4,{roughness:.35},48);
const water=new THREE.Mesh(new THREE.CylinderGeometry(1.18,1.18,.04,48),new THREE.MeshStandardMaterial({color:C.water,transparent:true,opacity:.82,roughness:.1,emissive:0x3C8C90,emissiveIntensity:.15}));
water.position.set(7.5,.6,4.4);scene.add(water);
const bubbles=[];
for(let i=0;i<26;i++){const b=new THREE.Mesh(new THREE.SphereGeometry(.035,8,6),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.75}));
  const a=Math.random()*6.28,r=Math.random()*1.05;b.position.set(7.5+Math.cos(a)*r,.58+Math.random()*.06,4.4+Math.sin(a)*r);
  b.userData.s=.1+Math.random()*.15;scene.add(b);bubbles.push(b);}
lounger(5.1,6,Math.PI);lounger(9.2,6,Math.PI);lounger(9.2,2,Math.PI/2+Math.PI);
cyl(scene,.32,.32,.04,C.marble,5,.5,1.2,{roughness:.3});cyl(scene,.04,.04,.48,0xB8955A,5,.24,1.2,BRASS,10);
cyl(scene,.06,.05,.1,C.white,4.9,.57,1.15);cyl(scene,.09,.07,.14,C.sage,5.12,.59,1.25);
plant(9.45,.6);plant(4.55,.6,.8);plant(9.45,6.9,.7);

/* ---------- face cabin ---------- */
bed(-7,-3.6,Math.PI/2,0xDCC9C4,0xF5EDEA);
{const g=grp(-5.7,-2.5);cyl(g,.18,.22,.05,0x9C9690,0,.03,0,BRASS);cyl(g,.025,.025,1.5,0x9C9690,0,.78,0,BRASS,10);
 const a=cyl(g,.02,.02,.7,0x9C9690,-.3,1.55,-.2,BRASS,10);a.rotation.z=1.1;

{const g=grp(-5.7,-4.1);cyl(g,.2,.2,.08,C.teal,0,.55,0);cyl(g,.03,.03,.5,0x9C9690,0,.27,0,BRASS,8);}
{const g=grp(-8.9,-5.9);[.15,.5,.85].forEach(y=>box(g,.7,.03,.45,C.white,0,y,0));
 [[-.33,-.2],[.33,-.2],[-.33,.2],[.33,.2]].forEach(p=>cyl(g,.015,.015,.85,0xB8955A,p[0],.45,p[1],BRASS,6));
 for(let k=0;k<4;k++)cyl(g,.05,.05,.14,[C.rose,C.white,C.sage,C.roseLight][k],-.24+k*.16,.94,0,{roughness:.4},10);}
{const g=grp(-7,-6.72);box(g,2.2,.9,.45,C.white,0,.45,0);box(g,2.3,.04,.5,C.marble,0,.92,0,{roughness:.3});
 box(g,1.2,.9,.03,0xCFE0E2,0,1.75,.2,{roughness:.05,metalness:.3});box(g,1.3,1,.02,0xB8955A,0,1.75,.18,BRASS);}

  for(let k=0;k<3;k++)box(g,.7,.08,.32,[C.white,C.roseLight,C.sage][k],0,y+.05+k*.09,0);});}
const flames=[];
{const g=grp(-3.25,-6.3);box(g,1,.35,.6,C.wood,0,.175,0);
 [[-.3,.06,.18],[0,-.1,.24],[.28,.1,.14],[-.1,.15,.1]].forEach(c=>{cyl(g,.06,.06,c[2],C.white,c[0],.35+c[2]/2,c[1],{},12);
   const f=new THREE.Mesh(new THREE.SphereGeometry(.03,8,6),new THREE.MeshStandardMaterial({color:0xFFB347,emissive:0xFF8A1F,emissiveIntensity:1.2}));
   f.position.set(c[0],.35+c[2]+.04,c[1]);g.add(f);flames.push(f);});}
cyl(scene,.32,.32,.12,C.rose,-3.2,.06,-1,{},20);cyl(scene,.32,.32,.12,C.sage,-2.5,.06,-.7,{},20);

/* ---------- sauna ---------- */
{const g=grp(3.5,-6.25);box(g,2.8,.45,.75,C.woodLight,0,.225,.45);box(g,2.8,.9,.6,C.woodLight,0,.45,-.2);box(g,2.8,.06,.65,0xD8B48A,0,.92,-.2);box(g,2.8,.06,.8,0xD8B48A,0,.47,.45);}

 box(g,.03,.9,.9,0xCFE0E2,-.22,1.6,0,{roughness:.05,metalness:.3});}

/* ---------- camera / orbit ---------- */
const isNarrow=()=>innerWidth<760;
const orbit={target:new THREE.Vector3(0,0,0),tG:new THREE.Vector3(0,0,0),theta:.55,thG:.55,phi:.92,phG:.92,r:isNarrow()?40:28,rG:isNarrow()?40:28};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function overview(){orbit.tG.set(0,0,isNarrow()?1.5:0);orbit.rG=isNarrow()?40:28;orbit.phG=.92;orbit.thG=.55;select(null);}
function pan(dx,dy){const s=orbit.r*.0016;const st=Math.sin(orbit.theta),ct=Math.cos(orbit.theta);
  orbit.tG.x-=ct*dx*s;orbit.tG.z+=st*dx*s;orbit.tG.x-=st*dy*s;orbit.tG.z-=ct*dy*s;
  orbit.tG.x=clamp(orbit.tG.x,-12,12);orbit.tG.z=clamp(orbit.tG.z,-10,10);}

/* ---------- selection & UI ---------- */
const nav=document.getElementById("rooms"),card=document.getElementById("card");
const btns={};
ROOMS.forEach(r=>{const b=document.createElement("button");b.setAttribute("aria-pressed","false");
  b.innerHTML='<span class="swatch" style="background:#'+r.floor.toString(16).padStart(6,"0")+'"></span>'+r.name;
  b.addEventListener("click",()=>{stopTour();select(r);});nav.appendChild(b);btns[r.id]=b;});
let selected=null;
function select(r){selected=r;
  Object.keys(btns).forEach(k=>btns[k].setAttribute("aria-pressed",r&&r.id===k?"true":"false"));
  if(!r){card.classList.remove("open");return;}
  orbit.tG.set(r.cx,.3,r.cz+(isNarrow()?1.2:0));orbit.rG=Math.max(r.w,r.d)*1.25+(isNarrow()?6:3.5);orbit.phG=.82;
  document.getElementById("cardTitle").textContent=r.name;
  document.getElementById("cardText").textContent=r.text;
  document.getElementById("cardList").innerHTML=r.items.map(i=>"<li>"+i+"</li>").join("");
  card.classList.add("open");
  if(btns[r.id].scrollIntoView)btns[r.id].scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});}
document.getElementById("cardClose").addEventListener("click",()=>select(null));
document.getElementById("btnOverview").addEventListener("click",()=>{stopTour();overview();});
const btnWalls=document.getElementById("btnWalls");
btnWalls.addEventListener("click",()=>{const up=wallGoal<.5;wallGoal=up?1:.36;btnWalls.textContent=up?"Abbassa le pareti":"Alza le pareti";});
let night=false;const btnLight=document.getElementById("btnLight");
btnLight.addEventListener("click",()=>{night=!night;btnLight.textContent=night?"Luce diurna":"Luce serale";});
let tourTimer=null,tourIdx=0;const btnTour=document.getElementById("btnTour");
function stopTour(){if(tourTimer){clearInterval(tourTimer);tourTimer=null;btnTour.setAttribute("aria-pressed","false");btnTour.textContent="Avvia il tour";}}
btnTour.addEventListener("click",()=>{if(tourTimer){stopTour();return;}
  btnTour.setAttribute("aria-pressed","true");btnTour.textContent="Ferma il tour";
  tourIdx=0;select(ROOMS[0]);tourTimer=setInterval(()=>{tourIdx=(tourIdx+1)%ROOMS.length;select(ROOMS[tourIdx]);orbit.thG+=.5;},5000);});

/* ---------- pointer input ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),tip=document.getElementById("tip");
let hovered=null;
function pick(e){mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);
  const h=ray.intersectObjects(floors);return h.length?h[0].object.userData.room:null;}
const pointers=new Map();let moved=0,lastPinch=null,panMode=false;
canvas.addEventListener("contextmenu",e=>e.preventDefault());
canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved=0;panMode=e.button===2||e.shiftKey;stopTour();});
canvas.addEventListener("pointermove",e=>{
  const p=pointers.get(e.pointerId);
  if(!p){if(e.pointerType==="mouse"){hovered=pick(e);if(hovered){tip.textContent=hovered.name;tip.style.left=e.clientX+"px";tip.style.top=e.clientY+"px";tip.classList.add("show");canvas.style.cursor="pointer";}else{tip.classList.remove("show");canvas.style.cursor="";}}return;}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);tip.classList.remove("show");
  if(pointers.size===1){if(panMode)pan(dx,dy);else{orbit.thG-=dx*.006;orbit.phG=clamp(orbit.phG-dy*.005,.18,1.38);}}
  else if(pointers.size===2){const v=[...pointers.values()];const dist=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);
    if(lastPinch)orbit.rG=clamp(orbit.rG*lastPinch/dist,5,50);lastPinch=dist;pan(dx/2,dy/2);}});
function up(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(pointers.size<2)lastPinch=null;
  if(pointers.size===0&&moved<6){const r=pick(e);if(r)select(r);}}
canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",e=>{pointers.delete(e.pointerId);lastPinch=null;});
canvas.addEventListener("pointerleave",()=>{tip.classList.remove("show");hovered=null;});
canvas.addEventListener("wheel",e=>{e.preventDefault();stopTour();orbit.rG=clamp(orbit.rG*(1+e.deltaY*.0012),5,50);},{passive:false});
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ---------- loop ---------- */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const clock=new THREE.Clock();
function tick(){
  const t=clock.getElapsedTime(),k=reduce?1:.09;
  orbit.theta+=(orbit.thG-orbit.theta)*k;orbit.phi+=(orbit.phG-orbit.phi)*k;orbit.r+=(orbit.rG-orbit.r)*k;orbit.target.lerp(orbit.tG,k);
  const sp=Math.sin(orbit.phi);
  camera.position.set(orbit.target.x+orbit.r*sp*Math.sin(orbit.theta),orbit.target.y+orbit.r*Math.cos(orbit.phi),orbit.target.z+orbit.r*sp*Math.cos(orbit.theta));
  camera.lookAt(orbit.target);
  wallScale+=(wallGoal-wallScale)*.1;walls.scale.y=wallScale;
  hemi.intensity+=((night?.18:.85)-hemi.intensity)*.06;sun.intensity+=((night?.08:.75)-sun.intensity)*.06;
  roomLights.forEach((l,i)=>{const goal=night?(ROOMS[i].id==="massage"?.6:1.1):0;l.intensity+=(goal-l.intensity)*.06;});
  ROOMS.forEach(r=>{const goal=r===selected?.28:(r===hovered?.14:0);r.glow+=(goal-r.glow)*.15;r.mesh.material.emissiveIntensity=r.glow;});
  if(!reduce){bubbles.forEach(b=>{b.position.y+=b.userData.s*.02;b.material.opacity=.8-(b.position.y-.58)*8;
      if(b.position.y>.68){const a=Math.random()*6.28,r=Math.random()*1.05;b.position.set(7.5+Math.cos(a)*r,.58,4.4+Math.sin(a)*r);}});
    water.position.y=.6+Math.sin(t*3)*.004;
    flames.forEach((f,i)=>{f.scale.y=1+Math.sin(t*9+i*2)*.25;f.material.emissiveIntensity=1+Math.sin(t*7+i)*.3;});
    stoveGlow.material.emissiveIntensity=.7+Math.sin(t*2)*.25;}
  renderer.render(scene,camera);requestAnimationFrame(tick);}
tick();
})();
